sonar.projectName=Copilot Toolkit
sonar.sourceEncoding=UTF-8

sonar.sources=src,webview-ui/src
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.test.ts

sonar.exclusions=out/**,media/**,node_modules/**,webview-ui/node_modules/**,**/*.d.ts
sonar.cpd.exclusions=src/test/**,src/prompts/BuiltInPrompts.ts,src/workflows/BuiltInWorkflows.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Built-in prompt/workflow catalogs are declarative data with intentionally repeated object shapes;
# exclude them from copy/paste detection while still analyzing them for bugs and coverage.
