name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v2.0.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Marketplace and GitHub Release
    runs-on: ubuntu-latest
    environment: marketplace-production
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      AZURE_CORE_OUTPUT: none
      AZURE_TOKEN_CREDENTIALS: AzureCliCredential

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        run: |
          node -e "const p=require('./package.json'); const expected='v'+p.version; if (process.env.RELEASE_TAG !== expected) { console.error('Tag '+process.env.RELEASE_TAG+' does not match package version '+expected); process.exit(1); }"

      - name: Compile and typecheck
        run: npm run compile

      - name: Test with coverage gates
        run: npm run test:coverage

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies --out copilot-toolkit-${RELEASE_TAG}.vsix

      - name: Verify VSIX hygiene
        run: |
          unzip -Z1 "copilot-toolkit-${RELEASE_TAG}.vsix" > vsix-files.txt
          grep -q '^extension/out/extension.js$' vsix-files.txt
          grep -q '^extension/media/studio/main.js$' vsix-files.txt
          if grep -E '^extension/(src/|out/test/|\.github/|docs/)|\.map$' vsix-files.txt; then
            echo 'VSIX contains development-only files.'
            exit 1
          fi

      - name: Create checksum
        run: sha256sum "copilot-toolkit-${RELEASE_TAG}.vsix" > "copilot-toolkit-${RELEASE_TAG}.vsix.sha256"

      - name: Authenticate to Microsoft Entra with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Marketplace publisher access
        run: npx @vscode/vsce verify-pat imsp-vibe-Coder-2596 --azure-credential

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --azure-credential --packagePath "copilot-toolkit-${RELEASE_TAG}.vsix"

      - name: Upload release build artifact
        uses: actions/upload-artifact@v7
        with:
          name: copilot-toolkit-${{ env.RELEASE_TAG }}
          path: |
            copilot-toolkit-${{ env.RELEASE_TAG }}.vsix
            copilot-toolkit-${{ env.RELEASE_TAG }}.vsix.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "copilot-toolkit-$RELEASE_TAG.vsix" \
            "copilot-toolkit-$RELEASE_TAG.vsix.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Copilot Toolkit $RELEASE_TAG"
