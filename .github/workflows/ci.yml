name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
      - 'v2-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile and typecheck
        run: npm run compile

      - name: Unit tests
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test with coverage gates
        run: npm run test:coverage

  security:
    name: Dependency security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Block critical build-tool vulnerabilities
        run: npm audit --audit-level=critical

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_REQUIRED: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile and typecheck
        run: npm run compile

      - name: Generate LCOV coverage for Sonar
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: npm run test:coverage:lcov

      - name: Validate Sonar configuration
        id: sonar-config
        shell: bash
        run: |
          if [[ "$SONAR_REQUIRED" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube Cloud scan is intentionally skipped for branch push CI. PRs, main and manual runs perform the authoritative scan."
            exit 0
          fi

          missing=()
          [[ -z "$SONAR_TOKEN" ]] && missing+=("SONAR_TOKEN secret")
          [[ -z "$SONAR_PROJECT_KEY" ]] && missing+=("SONAR_PROJECT_KEY variable")
          [[ -z "$SONAR_ORGANIZATION" ]] && missing+=("SONAR_ORGANIZATION variable")

          if (( ${#missing[@]} > 0 )); then
            printf -v missing_list '%s, ' "${missing[@]}"
            echo "::error::SonarQube Cloud scan is required but configuration is missing: ${missing_list%, }."
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Using CI-based SonarQube Cloud analysis. Automatic Analysis must be disabled for this project in SonarQube Cloud (Administration > Analysis Method)."

      - name: SonarQube Cloud scan
        id: sonar-scan
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Publish SonarQube summary
        if: always() && steps.sonar-config.outputs.enabled == 'true'
        shell: bash
        run: |
          dashboard="https://sonarcloud.io/summary/new_code?id=${SONAR_PROJECT_KEY}"
          {
            echo "## SonarQube Cloud"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Project | `${SONAR_PROJECT_KEY}` |"
            echo "| Quality Gate step | `${{ steps.sonar-scan.outcome }}` |"
            echo "| Dashboard | [Open live Sonar results](${dashboard}) |"
            echo
            echo "README badges expose the latest main-branch Quality Gate, coverage, bugs, vulnerabilities, code smells, and duplication metrics."
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs:
      - quality
      - coverage
      - security
      - sonar

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx @vscode/vsce package --no-dependencies --out copilot-toolkit.vsix

      - name: Verify VSIX hygiene
        run: |
          unzip -Z1 copilot-toolkit.vsix > vsix-files.txt
          grep -q '^extension/out/extension.js$' vsix-files.txt
          grep -q '^extension/media/studio/main.js$' vsix-files.txt
          if grep -E '^extension/(src/|out/test/|\.github/|docs/)|\.map$' vsix-files.txt; then
            echo 'VSIX contains development-only files.'
            exit 1
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: copilot-toolkit-vsix
          path: copilot-toolkit.vsix
          if-no-files-found: error
          retention-days: 14
